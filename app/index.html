<title>Caixa do Murillo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: app de bolso — coluna única no celular; no desktop, resumo à esquerda e extrato à direita. Botão "Lançar" fixo embaixo. */
:root {
  --bg: #EEF1EC;
  --surface: #FFFFFF;
  --surface-2: #F5F7F3;
  --ink: #15211B;
  --muted: #5E6B63;
  --line: #DCE2DA;
  --accent: #F2B33D;        /* moeda: o único destaque forte */
  --accent-ink: #2A1E00;
  --hero: #17332A;          /* cartão principal */
  --hero-ink: #F3F7F2;
  --hero-muted: #A9C2B6;
  --in: #11845F;
  --in-soft: #DDF1E8;
  --out: #C8473D;
  --out-soft: #F9E1DE;
  --warn: #B7791F;
  --shadow: 0 1px 2px rgba(21,33,27,.06), 0 8px 24px rgba(21,33,27,.06);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 18px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1411; --surface: #16201B; --surface-2: #1C2822; --ink: #E9F0EA; --muted: #95A69C; --line: #2A3830;
  --accent: #F5BC4E; --accent-ink: #231900; --hero: #1F3B30; --hero-ink: #F1F7F2; --hero-muted: #9DBBAD;
  --in: #3CC48F; --in-soft: #17372A; --out: #F07065; --out-soft: #3A1E1B; --warn: #E3A548;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0D1411; --surface: #16201B; --surface-2: #1C2822; --ink: #E9F0EA; --muted: #95A69C; --line: #2A3830;
  --accent: #F5BC4E; --accent-ink: #231900; --hero: #1F3B30; --hero-ink: #F1F7F2; --hero-muted: #9DBBAD;
  --in: #3CC48F; --in-soft: #17372A; --out: #F07065; --out-soft: #3A1E1B; --warn: #E3A548;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.45; padding: 0 16px; padding-block: 0 110px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.wrap { max-width: 1120px; margin: 0 auto; }

header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 18px 14px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 22px; letter-spacing: -.02em; display: flex; align-items: center; gap: 10px; }
.coin { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 13px; font-weight: 800; box-shadow: inset 0 -3px 0 rgba(0,0,0,.15); }
.month { display: flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.month button { border: 0; background: transparent; width: 34px; height: 34px; border-radius: 50%; font-size: 18px; }
.month button:hover { background: var(--surface-2); }
.month strong { font-family: var(--f-display); font-weight: 700; min-width: 132px; text-align: center; text-transform: capitalize; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 14px; }

.grid { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 900px) { .grid { grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); align-items: start; } .col-r { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); } }
.col { display: grid; gap: 16px; min-width: 0; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.card h2 { font-family: var(--f-display); font-size: 17px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.card-h small { color: var(--muted); font-size: 13px; }

/* Hero */
.hero { background: var(--hero); color: var(--hero-ink); border: 0; padding: 22px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -60px; top: -60px; width: 200px; height: 200px; border-radius: 50%; border: 28px solid var(--accent); opacity: .16; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .09em; font-weight: 600; color: var(--hero-muted); }
.big { font-family: var(--f-display); font-weight: 800; font-size: clamp(38px, 9vw, 54px); line-height: 1.02; letter-spacing: -.03em; margin: 6px 0 4px; font-variant-numeric: tabular-nums; }
.big.neg { color: #FF9C92; }
.hero .sub { color: var(--hero-muted); font-size: 14px; }
.flows { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; position: relative; z-index: 1; }
.flow { background: rgba(255,255,255,.07); border-radius: 14px; padding: 12px 14px; }
.flow span { font-size: 12px; color: var(--hero-muted); display: flex; align-items: center; gap: 6px; }
.flow b { display: block; font-size: 19px; margin-top: 2px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.meter { height: 8px; background: rgba(255,255,255,.12); border-radius: 99px; overflow: hidden; margin-top: 16px; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .5s; }
.meter-l { display: flex; justify-content: space-between; font-size: 12px; color: var(--hero-muted); margin-top: 6px; gap: 8px; }

/* Mini stats */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; min-width: 0; }
.stat span { font-size: 12px; color: var(--muted); display: block; }
.stat b { font-size: 16px; display: block; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat em { font-style: normal; font-size: 12px; color: var(--muted); }
@media (max-width: 460px) { .stats { grid-template-columns: 1fr 1fr; } .stats .stat:last-child { grid-column: span 2; } }

/* Semanas */
.weeks { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0,1fr); gap: 10px; align-items: end; height: 150px; }
.wk { display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; min-width: 0; }
.wk .bar-h { width: 100%; max-width: 46px; border-radius: 10px 10px 4px 4px; background: var(--surface-2); border: 1px solid var(--line); min-height: 4px; transition: height .5s; }
.wk.now .bar-h { background: var(--accent); border-color: transparent; }
.wk .v { font-size: 11px; color: var(--muted); white-space: nowrap; }
.wk .l { font-size: 11px; color: var(--muted); white-space: nowrap; }
.wk.now .l { color: var(--ink); font-weight: 700; }

/* Categorias */
.cats { display: grid; gap: 14px; }
.cat { display: grid; grid-template-columns: 34px minmax(0,1fr); gap: 4px 12px; align-items: center; }
.mono { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; font-weight: 700; font-size: 13px; grid-row: span 2; color: #fff; }
.cat-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; min-width: 0; }
.cat-top b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat-top .num { font-size: 13px; white-space: nowrap; }
.cat-top .num small { color: var(--muted); }
.bar { height: 7px; background: var(--surface-2); border-radius: 99px; overflow: hidden; position: relative; }
.bar i { display: block; height: 100%; border-radius: 99px; transition: width .5s; }
.flag { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 99px; margin-left: 6px; vertical-align: 1px; }
.flag.over { background: var(--out-soft); color: var(--out); }
.flag.near { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.flag.ok { background: var(--in-soft); color: var(--in); }
.group-l { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin: 4px 0 -4px; }

/* Rolê */
.role { display: flex; align-items: center; gap: 16px; }
.ring { width: 76px; height: 76px; flex: none; }
.role p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.role b.num { font-size: 22px; }

/* Extrato */
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.day { margin-top: 14px; }
.day-h { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; padding: 0 2px 6px; border-bottom: 1px solid var(--line); }
.tx { display: grid; grid-template-columns: 34px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 10px 2px; border: 0; background: transparent; width: 100%; text-align: left; border-bottom: 1px solid var(--line); border-radius: 0; }
.tx:hover { background: var(--surface-2); }
.tx .mono { grid-row: auto; width: 34px; height: 34px; }
.tx .t b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx .t span { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.tx .amt { font-weight: 600; white-space: nowrap; }
.amt.in { color: var(--in); }
.tag-ex { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; background: color-mix(in srgb, var(--accent) 30%, transparent); color: var(--ink); padding: 1px 6px; border-radius: 6px; margin-left: 6px; vertical-align: 1px; }
.empty { text-align: center; padding: 28px 10px; color: var(--muted); }
.empty b { display: block; color: var(--ink); font-family: var(--f-display); font-size: 17px; margin-bottom: 4px; }
.banner { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: color-mix(in srgb, var(--accent) 22%, var(--surface)); border: 1px solid color-mix(in srgb, var(--accent) 50%, var(--line)); border-radius: 14px; padding: 10px 14px; font-size: 14px; }
.banner button { border: 0; background: var(--ink); color: var(--bg); border-radius: 999px; padding: 6px 12px; font-weight: 600; font-size: 13px; }
.note { font-size: 13px; color: var(--muted); }

/* FAB */
.fab { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 20; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-family: var(--f-display); font-size: 17px; padding: 15px 30px; border-radius: 999px; box-shadow: 0 10px 30px rgba(0,0,0,.25), inset 0 -3px 0 rgba(0,0,0,.12); display: flex; align-items: center; gap: 10px; }
.fab span { font-size: 24px; line-height: 0; }
.fab:active { transform: translateX(-50%) scale(.97); }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgba(8,14,11,.5); z-index: 40; display: flex; align-items: flex-end; justify-content: center; animation: fade .2s; }
.sheet { background: var(--surface); width: 100%; max-width: 520px; max-height: 92%; overflow: auto; border-radius: 24px 24px 0 0; padding: 18px 18px calc(22px + env(safe-area-inset-bottom, 0px)); animation: up .25s cubic-bezier(.2,.8,.2,1); }
@media (min-width: 620px) { .scrim { align-items: center; } .sheet { border-radius: 24px; } }
@keyframes up { from { transform: translateY(30px); opacity: .4; } }
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
.sheet-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.sheet-h h3 { margin: 0; font-family: var(--f-display); font-size: 20px; }
.x { border: 0; background: var(--surface-2); width: 34px; height: 34px; border-radius: 50%; font-size: 18px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); padding: 4px; border-radius: 14px; gap: 4px; }
.seg button { border: 0; background: transparent; padding: 10px; border-radius: 10px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"].out { background: var(--out); color: #fff; }
.seg button[aria-pressed="true"].in { background: var(--in); color: #fff; }
.amount { display: flex; align-items: baseline; gap: 8px; justify-content: center; margin: 18px 0 8px; }
.amount span { font-family: var(--f-display); font-size: 24px; color: var(--muted); font-weight: 700; }
.amount input { border: 0; background: transparent; font-family: var(--f-display); font-weight: 800; font-size: 46px; width: 100%; max-width: 260px; text-align: center; outline: none; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.amount input::placeholder { color: var(--line); }
.field { display: grid; gap: 6px; margin-top: 14px; }
.field > label, .field > .lbl { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
.field input[type=text], .field input[type=date], .field input[type=number], .field select { border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 11px 12px; width: 100%; min-width: 0; }
.picks { display: flex; flex-wrap: wrap; gap: 6px; }
.pick { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 7px; }
.pick[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.actions { display: flex; gap: 10px; margin-top: 20px; }
.btn { flex: 1; border: 0; border-radius: 14px; padding: 14px; font-weight: 700; font-size: 16px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: var(--surface-2); }
.btn.danger { background: var(--out-soft); color: var(--out); flex: 0 0 auto; padding-inline: 18px; }
.btn.danger.armed { background: var(--out); color: #fff; }
.err { color: var(--out); font-size: 13px; margin-top: 10px; min-height: 1em; }

/* Configurações */
.cfg-row { display: grid; grid-template-columns: minmax(0,1fr) 92px 120px 34px; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.cfg-row input, .cfg-row select { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 8px 9px; width: 100%; min-width: 0; font-size: 14px; }
.cfg-row .rm { border: 0; background: transparent; color: var(--muted); font-size: 18px; }
@media (max-width: 460px) { .cfg-row { grid-template-columns: minmax(0,1fr) 108px 30px; } .cfg-row select { grid-column: 1; grid-row: 2; } .cfg-row .prev { grid-column: 2; grid-row: 1 / span 2; } }
.add-cat { border: 1px dashed var(--line); background: transparent; border-radius: 12px; padding: 10px; width: 100%; margin-top: 10px; font-weight: 600; color: var(--muted); }
.totals { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; margin-top: 14px; }
.totals div { background: var(--surface-2); border-radius: 12px; padding: 10px; font-size: 12px; color: var(--muted); }
.totals b { display: block; font-size: 14px; color: var(--ink); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; z-index: 60; animation: up .2s; }
.status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><span class="coin" aria-hidden="true">R$</span>Caixa do Murillo</div>
    <div class="month" role="group" aria-label="Mês">
      <button id="prev" aria-label="Mês anterior">‹</button>
      <strong id="mlabel">—</strong>
      <button id="next" aria-label="Próximo mês">›</button>
    </div>
    <button class="icon-btn" id="openCfg">Metas do mês</button>
  </header>

  <div id="banner"></div>

  <div class="grid" style="margin-top:12px">
    <div class="col">
      <section class="card hero" aria-label="Resumo do mês">
        <div class="eyebrow" id="heroLbl">Sobrou no mês</div>
        <div class="big" id="saldo">R$ 0,00</div>
        <div class="sub" id="heroSub">Previsto: —</div>
        <div class="flows">
          <div class="flow"><span><i class="dot" style="background:var(--in)"></i>Entrou</span><b class="num" id="entrou">—</b></div>
          <div class="flow"><span><i class="dot" style="background:var(--out)"></i>Saiu</span><b class="num" id="saiu">—</b></div>
        </div>
        <div class="meter" aria-hidden="true"><i id="meter" style="width:0%"></i></div>
        <div class="meter-l"><span id="meterL">—</span><span id="meterR"></span></div>
      </section>

      <div class="stats">
        <div class="stat"><span>Esta semana</span><b class="num" id="sWeek">—</b><em id="sWeekSub">gasto</em></div>
        <div class="stat"><span>Média por dia</span><b class="num" id="sDay">—</b><em>de gasto no mês</em></div>
        <div class="stat"><span>Ainda pode gastar</span><b class="num" id="sLeft">—</b><em id="sLeftSub">pelas metas</em></div>
      </div>

      <section class="card">
        <div class="card-h"><h2>Gasto por semana</h2><small>seg a dom</small></div>
        <div class="weeks" id="weeks"></div>
      </section>

      <section class="card">
        <div class="card-h"><h2>Rua, iFood e bar</h2><small>o termômetro do rolê</small></div>
        <div class="role" id="role"></div>
      </section>

      <section class="card">
        <div class="card-h"><h2>Metas por categoria</h2><small id="catHint">realizado / previsto</small></div>
        <div class="cats" id="cats"></div>
      </section>
    </div>

    <div class="col col-r">
      <section class="card">
        <div class="card-h"><h2>Extrato</h2><span class="status" id="status"></span></div>
        <div class="filters" role="group" aria-label="Filtro">
          <button class="chip" data-f="all" aria-pressed="true">Tudo</button>
          <button class="chip" data-f="Gasto" aria-pressed="false">Gastos</button>
          <button class="chip" data-f="Ganho" aria-pressed="false">Ganhos</button>
        </div>
        <div id="list"></div>
      </section>
    </div>
  </div>
</div>

<button class="fab" id="fab"><span>+</span>Lançar</button>
<div id="layer"></div>

<script>
(() => {
const BRL = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
const money = v => BRL.format(v || 0);
const short = v => { const a = Math.abs(v); return a >= 10000 ? "R$ " + (v/1000).toLocaleString("pt-BR", {maximumFractionDigits: 1}) + " mil" : money(v); };
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const HUES = ["#2E7D5B","#3A6EA5","#8A5CB8","#C0563F","#B7791F","#1F8A8A","#C2477A","#5B7F2E","#6B5BD1","#A0522D","#2F6F4F","#B34E6B","#4F7CAC","#8C6D1F","#3D8C6E","#7A4FA0"];
const DEFAULT_CATS = [
  { id: "salario", nome: "Salário", tipo: "Ganho", previsto: 0 },
  { id: "variavel", nome: "Renda variável", tipo: "Ganho", previsto: 0 },
  { id: "outros-ganhos", nome: "Outros ganhos", tipo: "Ganho", previsto: 0 },
  { id: "aluguel", nome: "Aluguel", tipo: "Gasto", previsto: 0 },
  { id: "luz", nome: "Luz", tipo: "Gasto", previsto: 0 },
  { id: "agua", nome: "Água", tipo: "Gasto", previsto: 0 },
  { id: "emprestimos", nome: "Empréstimos", tipo: "Gasto", previsto: 0 },
  { id: "casa", nome: "Compras de casa", tipo: "Gasto", previsto: 0 },
  { id: "rua", nome: "Alimentação na rua", tipo: "Gasto", previsto: 0 },
  { id: "ifood", nome: "iFood", tipo: "Gasto", previsto: 0 },
  { id: "bar", nome: "Bar", tipo: "Gasto", previsto: 0 },
  { id: "transporte", nome: "Transporte", tipo: "Gasto", previsto: 0 },
  { id: "internet", nome: "Internet/Celular", tipo: "Gasto", previsto: 0 },
  { id: "assinaturas", nome: "Assinaturas", tipo: "Gasto", previsto: 0 },
  { id: "saude", nome: "Saúde", tipo: "Gasto", previsto: 0 },
  { id: "lazer", nome: "Lazer", tipo: "Gasto", previsto: 0 },
  { id: "outros", nome: "Outros gastos", tipo: "Gasto", previsto: 0 },
];
const ROLE = ["rua", "ifood", "bar"];
const PAGTOS = ["Pix", "Débito", "Crédito", "Dinheiro", "Boleto"];

const pad = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
const parseISO = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const today = new Date();

let cats = DEFAULT_CATS.slice();
let entries = [];
let ym = today.getFullYear() + "-" + pad(today.getMonth()+1);
let filter = "all";
let db = null, online = false;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const catOf = id => cats.find(c => c.id === id) || { id, nome: id || "Sem categoria", tipo: "Gasto", previsto: 0 };
const colorOf = id => { const i = cats.findIndex(c => c.id === id); return HUES[(i < 0 ? 15 : i) % HUES.length]; };
const initials = n => (n || "?").split(/[\s/]+/).filter(Boolean).slice(0,2).map(w => w[0]).join("").toUpperCase();

function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}

/* ---------- cálculo ---------- */
function monthData() {
  const list = entries.filter(e => (e.data || "").startsWith(ym));
  const by = {}; let ganho = 0, gasto = 0;
  for (const e of list) {
    const v = Number(e.valor) || 0;
    by[e.categoria] = (by[e.categoria] || 0) + v;
    if (e.tipo === "Ganho") ganho += v; else gasto += v;
  }
  return { list, by, ganho, gasto };
}
function weeksOf(y, m) { // semanas seg-dom que tocam o mês
  const first = new Date(y, m, 1), last = new Date(y, m+1, 0);
  let start = new Date(first); start.setDate(first.getDate() - ((first.getDay()+6)%7));
  const out = [];
  while (start <= last) {
    const end = new Date(start); end.setDate(start.getDate()+6);
    out.push({ start: new Date(start), end, a: start < first ? first : new Date(start), b: end > last ? last : end });
    start.setDate(start.getDate()+7);
  }
  return out;
}

/* ---------- render ---------- */
function render() {
  const [y, m] = ym.split("-").map(Number);
  $("mlabel").textContent = MESES[m-1] + " " + y;
  const { list, by, ganho, gasto } = monthData();
  const saldo = ganho - gasto;
  const prevG = cats.filter(c => c.tipo === "Ganho").reduce((s,c) => s + (+c.previsto||0), 0);
  const prevS = cats.filter(c => c.tipo === "Gasto").reduce((s,c) => s + (+c.previsto||0), 0);

  $("heroLbl").textContent = "Sobrou em " + MESES[m-1];
  $("saldo").textContent = money(saldo);
  $("saldo").classList.toggle("neg", saldo < 0);
  $("heroSub").textContent = (prevG || prevS) ? "Previsto: sobrar " + money(prevG - prevS) + " (entra " + short(prevG) + ", sai " + short(prevS) + ")" : "Defina suas metas pra comparar com o previsto";
  $("entrou").textContent = money(ganho);
  $("saiu").textContent = money(gasto);
  const pct = ganho > 0 ? gasto / ganho : (gasto > 0 ? 1 : 0);
  $("meter").style.width = Math.min(100, pct*100) + "%";
  $("meter").style.background = pct > 1 ? "var(--out)" : "var(--accent)";
  $("meterL").textContent = ganho > 0 ? "Gastou " + Math.round(pct*100) + "% do que entrou" : (gasto > 0 ? "Ainda não entrou nada este mês" : "Sem lançamentos neste mês");
  $("meterR").textContent = list.length + (list.length === 1 ? " lançamento" : " lançamentos");

  // stats
  const ws = weeksOf(y, m-1);
  const tIso = iso(today);
  const curW = ws.find(w => iso(w.a) <= tIso && tIso <= iso(w.b));
  const sumRange = (a, b) => list.filter(e => e.tipo !== "Ganho" && e.data >= a && e.data <= b).reduce((s,e) => s + (+e.valor||0), 0);
  if (curW) { $("sWeek").textContent = money(sumRange(iso(curW.a), iso(curW.b))); $("sWeekSub").textContent = "gasto até agora"; }
  else { const lw = ws[ws.length-1]; $("sWeek").textContent = money(sumRange(iso(lw.a), iso(lw.b))); $("sWeekSub").textContent = "última semana do mês"; }
  const isCur = ym === tIso.slice(0,7);
  const days = isCur ? today.getDate() : new Date(y, m, 0).getDate();
  $("sDay").textContent = money(gasto / days);
  if (prevS > 0) { const left = prevS - gasto; $("sLeft").textContent = money(left); $("sLeft").style.color = left < 0 ? "var(--out)" : ""; $("sLeftSub").textContent = left < 0 ? "acima das metas" : "dentro das metas"; }
  else { $("sLeft").textContent = "—"; $("sLeft").style.color = ""; $("sLeftSub").textContent = "defina as metas"; }

  // semanas
  const wv = ws.map(w => sumRange(iso(w.a), iso(w.b)));
  const max = Math.max(1, ...wv);
  $("weeks").innerHTML = ws.map((w, i) => {
    const now = curW && w === curW;
    const lbl = w.a.getDate() + "–" + w.b.getDate();
    return `<div class="wk${now ? " now" : ""}" title="${esc(money(wv[i]))}"><span class="v num">${wv[i] ? esc(short(wv[i]).replace("R$ ","")) : ""}</span><div class="bar-h" style="height:${Math.max(3, wv[i]/max*100)}%"></div><span class="l">${lbl}</span></div>`;
  }).join("");

  // rolê
  const role = ROLE.reduce((s, id) => s + (by[id] || 0), 0);
  const roleMeta = ROLE.reduce((s, id) => s + (+catOf(id).previsto || 0), 0);
  const share = ganho > 0 ? role / ganho : 0;
  const ringP = roleMeta > 0 ? Math.min(1, role/roleMeta) : Math.min(1, share);
  const C = 2*Math.PI*30;
  const ringCol = roleMeta > 0 && role > roleMeta ? "var(--out)" : "var(--accent)";
  $("role").innerHTML = `
    <svg class="ring" viewBox="0 0 76 76" aria-hidden="true"><circle cx="38" cy="38" r="30" fill="none" stroke="var(--surface-2)" stroke-width="9"/>
    <circle cx="38" cy="38" r="30" fill="none" stroke="${ringCol}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(ringP*C).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 38 38)"/>
    <text x="38" y="43" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)" font-family="IBM Plex Mono, monospace">${roleMeta > 0 ? Math.round(role/roleMeta*100) : Math.round(share*100)}%</text></svg>
    <div><b class="num">${esc(money(role))}</b>
    <p>${ROLE.map(id => esc(catOf(id).nome) + " " + esc(short(by[id]||0))).join(" · ")}</p>
    <p>${roleMeta > 0 ? (role > roleMeta ? "Passou " + esc(money(role-roleMeta)) + " da meta de " + esc(money(roleMeta)) : "da meta de " + esc(money(roleMeta))) : (ganho > 0 ? "do que entrou no mês" : "Defina uma meta pra essas três categorias")}</p></div>`;

  // categorias
  const row = c => {
    const real = by[c.id] || 0, prev = +c.previsto || 0, col = colorOf(c.id);
    const p = prev > 0 ? real/prev : 0;
    let flag = "", fill = col;
    if (c.tipo === "Gasto" && prev > 0) {
      if (p > 1) { flag = `<span class="flag over">+${esc(short(real-prev))}</span>`; fill = "var(--out)"; }
      else if (p >= .85) flag = `<span class="flag near">${Math.round(p*100)}%</span>`;
    } else if (c.tipo === "Ganho" && prev > 0 && p >= 1) flag = `<span class="flag ok">bateu</span>`;
    return `<div class="cat"><div class="mono" style="background:${col}">${esc(initials(c.nome))}</div>
      <div class="cat-top"><b>${esc(c.nome)}${flag}</b><span class="num">${esc(money(real))}${prev ? ` <small>/ ${esc(short(prev))}</small>` : ""}</span></div>
      <div class="bar"><i style="width:${prev ? Math.min(100, p*100) : (real ? 100 : 0)}%;background:${fill};${prev ? "" : "opacity:.35"}"></i></div></div>`;
  };
  const gan = cats.filter(c => c.tipo === "Ganho"), gas = cats.filter(c => c.tipo === "Gasto");
  const sortG = gas.slice().sort((a,b) => (by[b.id]||0) - (by[a.id]||0));
  $("cats").innerHTML = `<div class="group-l">Entradas</div>${gan.map(row).join("")}<div class="group-l" style="margin-top:6px">Saídas</div>${sortG.map(row).join("")}`;
  $("catHint").textContent = prevS ? "realizado / previsto" : "toque em Metas do mês pra definir";

  // extrato
  const shown = list.filter(e => filter === "all" || e.tipo === filter).sort((a,b) => (b.data.localeCompare(a.data)) || String(b.criadoEm||"").localeCompare(String(a.criadoEm||"")));
  if (!shown.length) {
    $("list").innerHTML = `<div class="empty"><b>Nada lançado ${filter === "all" ? "" : "nesse filtro "}em ${MESES[m-1]}</b>Toque em <strong>Lançar</strong> embaixo, ou me conte no chat o que gastou que eu lanço pra você.</div>`;
  } else {
    const groups = {};
    for (const e of shown) (groups[e.data] ||= []).push(e);
    $("list").innerHTML = Object.keys(groups).map(d => {
      const items = groups[d];
      const net = items.reduce((s,e) => s + (e.tipo === "Ganho" ? 1 : -1) * (+e.valor||0), 0);
      const dl = parseISO(d).toLocaleDateString("pt-BR", { weekday: "short", day: "2-digit", month: "short" });
      return `<div class="day"><div class="day-h"><span>${esc(dl)}</span><span class="num">${esc(money(net))}</span></div>${items.map(e => {
        const c = catOf(e.categoria);
        return `<button class="tx" data-id="${esc(e.id)}"><div class="mono" style="background:${colorOf(e.categoria)}">${esc(initials(c.nome))}</div>
          <div class="t"><b>${esc(e.descricao || c.nome)}${e.exemplo ? '<span class="tag-ex">exemplo</span>' : ""}</b><span>${esc(c.nome)}${e.pagamento ? " · " + esc(e.pagamento) : ""}</span></div>
          <span class="amt num${e.tipo === "Ganho" ? " in" : ""}">${e.tipo === "Ganho" ? "+" : "−"}${esc(money(+e.valor||0))}</span></button>`;
      }).join("")}</div>`;
    }).join("");
  }

  // banner de exemplos
  const ex = entries.filter(e => e.exemplo);
  $("banner").innerHTML = ex.length ? `<div class="banner"><span>Tem ${ex.length} lançamentos de <b>exemplo</b> pra você ver como fica.</span><button id="clearEx">Apagar exemplos</button></div>` : "";
  if (ex.length) $("clearEx").onclick = clearExamples;

  $("status").innerHTML = online ? `<i class="dot" style="background:var(--in)"></i>salvo na nuvem` : `<i class="dot" style="background:var(--warn)"></i>só neste aparelho`;
}

/* ---------- sheets ---------- */
function closeLayer() { $("layer").innerHTML = ""; }
function openEntry(entry) {
  const editing = !!entry;
  const st = { tipo: entry?.tipo || "Gasto", categoria: entry?.categoria || "", pagamento: entry?.pagamento || "Pix" };
  $("layer").innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shT">
    <div class="sheet-h"><h3 id="shT">${editing ? "Editar lançamento" : "Novo lançamento"}</h3><button class="x" id="shX" aria-label="Fechar">×</button></div>
    <div class="seg" role="group" aria-label="Tipo"><button class="out" data-t="Gasto">Gasto</button><button class="in" data-t="Ganho">Ganho</button></div>
    <div class="amount"><span>R$</span><input id="fValor" inputmode="decimal" placeholder="0,00" autocomplete="off" value="${entry ? esc(String(entry.valor).replace(".", ",")) : ""}"></div>
    <div class="field"><span class="lbl">Categoria</span><div class="picks" id="fCats"></div></div>
    <div class="field"><label for="fDesc">Descrição</label><input type="text" id="fDesc" placeholder="Ex.: pizza com a galera" value="${esc(entry?.descricao || "")}"></div>
    <div class="field"><label for="fData">Data</label><input type="date" id="fData" value="${esc(entry?.data || (ym === iso(today).slice(0,7) ? iso(today) : ym + "-01"))}"></div>
    <div class="field"><span class="lbl">Pagamento</span><div class="picks" id="fPag"></div></div>
    <div class="err" id="fErr"></div>
    <div class="actions">${editing ? '<button class="btn danger" id="fDel">Apagar</button>' : ""}<button class="btn primary" id="fSave">${editing ? "Salvar" : "Lançar"}</button></div>
  </div></div>`;
  const drawSeg = () => document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.t === st.tipo));
  const drawCats = () => {
    const opts = cats.filter(c => c.tipo === st.tipo);
    if (!opts.some(c => c.id === st.categoria)) st.categoria = "";
    $("fCats").innerHTML = opts.map(c => `<button class="pick" data-c="${esc(c.id)}" aria-pressed="${c.id === st.categoria}"><i class="dot" style="background:${colorOf(c.id)}"></i>${esc(c.nome)}</button>`).join("");
  };
  const drawPag = () => { $("fPag").innerHTML = PAGTOS.map(p => `<button class="pick" data-p="${p}" aria-pressed="${p === st.pagamento}">${p}</button>`).join(""); };
  drawSeg(); drawCats(); drawPag();
  document.querySelector(".seg").onclick = e => { const b = e.target.closest("button"); if (!b) return; st.tipo = b.dataset.t; drawSeg(); drawCats(); };
  $("fCats").onclick = e => { const b = e.target.closest("button"); if (!b) return; st.categoria = b.dataset.c; drawCats(); };
  $("fPag").onclick = e => { const b = e.target.closest("button"); if (!b) return; st.pagamento = st.pagamento === b.dataset.p ? "" : b.dataset.p; drawPag(); };
  $("shX").onclick = closeLayer;
  $("scrim").onclick = e => { if (e.target.id === "scrim") closeLayer(); };
  if (!editing) setTimeout(() => $("fValor").focus(), 60);
  $("fSave").onclick = async () => {
    const raw = $("fValor").value.trim().replace(/\s|R\$/g, "");
    const valor = Number(raw.includes(",") ? raw.replace(/\./g, "").replace(",", ".") : raw);
    if (!valor || valor <= 0) return $("fErr").textContent = "Digite um valor maior que zero, ex.: 45,90.";
    if (!st.categoria) return $("fErr").textContent = "Escolha uma categoria.";
    const data = $("fData").value; if (!data) return $("fErr").textContent = "Escolha a data.";
    const doc = { data, tipo: st.tipo, categoria: st.categoria, descricao: $("fDesc").value.trim(), valor: Math.round(valor*100)/100, pagamento: st.pagamento, criadoEm: entry?.criadoEm || new Date().toISOString() };
    $("fSave").disabled = true;
    try {
      await saveEntry(entry?.id, doc);
      closeLayer(); toast(editing ? "Lançamento atualizado" : "Lançado: " + money(doc.valor));
      if (data.slice(0,7) !== ym) { ym = data.slice(0,7); render(); }
    } catch (err) { $("fErr").textContent = "Não salvou. Confira a conexão e tente de novo."; $("fSave").disabled = false; }
  };
  if (editing) {
    let armed = false;
    $("fDel").onclick = async () => {
      if (!armed) { armed = true; $("fDel").classList.add("armed"); $("fDel").textContent = "Confirmar"; return; }
      try { await removeEntry(entry.id); closeLayer(); toast("Lançamento apagado"); }
      catch { $("fErr").textContent = "Não apagou. Tente de novo."; }
    };
  }
}

function openCfg() {
  let draft = cats.map(c => ({ ...c }));
  $("layer").innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="cfT" style="max-width:600px">
    <div class="sheet-h"><h3 id="cfT">Metas do mês</h3><button class="x" id="shX" aria-label="Fechar">×</button></div>
    <p class="note" style="margin:0 0 8px">Quanto você espera ganhar (salário, renda variável) e quanto quer gastar por mês em cada categoria. Vale pra todos os meses.</p>
    <div id="cfRows"></div>
    <button class="add-cat" id="cfAdd">+ Nova categoria</button>
    <div class="totals" id="cfTot"></div>
    <div class="err" id="cfErr"></div>
    <div class="actions"><button class="btn ghost" id="cfCancel">Cancelar</button><button class="btn primary" id="cfSave">Salvar metas</button></div>
  </div></div>`;
  const draw = () => {
    $("cfRows").innerHTML = draft.map((c, i) => `<div class="cfg-row">
      <input aria-label="Nome" data-i="${i}" data-k="nome" value="${esc(c.nome)}">
      <select aria-label="Tipo" data-i="${i}" data-k="tipo"><option ${c.tipo === "Gasto" ? "selected" : ""}>Gasto</option><option ${c.tipo === "Ganho" ? "selected" : ""}>Ganho</option></select>
      <input class="prev num" aria-label="Previsto por mês" inputmode="decimal" data-i="${i}" data-k="previsto" value="${c.previsto ? esc(String(c.previsto).replace(".", ",")) : ""}" placeholder="R$ 0">
      <button class="rm" data-rm="${i}" aria-label="Remover ${esc(c.nome)}">×</button></div>`).join("");
    tot();
  };
  const num = s => { s = String(s).trim().replace(/\s|R\$/g, ""); return Number(s.includes(",") ? s.replace(/\./g, "").replace(",", ".") : s) || 0; };
  const tot = () => {
    const g = draft.filter(c => c.tipo === "Ganho").reduce((s,c) => s + num(c.previsto), 0);
    const s = draft.filter(c => c.tipo === "Gasto").reduce((s2,c) => s2 + num(c.previsto), 0);
    $("cfTot").innerHTML = `<div>Entra<b class="num">${esc(short(g))}</b></div><div>Sai<b class="num">${esc(short(s))}</b></div><div>Sobra<b class="num" style="color:${g-s<0?"var(--out)":"var(--in)"}">${esc(short(g-s))}</b></div>`;
  };
  draw();
  $("cfRows").oninput = e => { const t = e.target; if (t.dataset.i == null) return; draft[+t.dataset.i][t.dataset.k] = t.value; tot(); };
  $("cfRows").onclick = e => { const b = e.target.closest("[data-rm]"); if (!b) return; draft.splice(+b.dataset.rm, 1); draw(); };
  $("cfAdd").onclick = () => { draft.push({ id: "c" + Date.now().toString(36), nome: "", tipo: "Gasto", previsto: 0 }); draw(); const ins = $("cfRows").querySelectorAll('input[data-k="nome"]'); ins[ins.length-1].focus(); };
  $("shX").onclick = closeLayer; $("cfCancel").onclick = closeLayer;
  $("scrim").onclick = e => { if (e.target.id === "scrim") closeLayer(); };
  $("cfSave").onclick = async () => {
    const lista = draft.filter(c => String(c.nome).trim()).map(c => ({ id: c.id, nome: String(c.nome).trim(), tipo: c.tipo, previsto: Math.round(num(c.previsto)*100)/100 }));
    if (!lista.length) return $("cfErr").textContent = "Deixe pelo menos uma categoria.";
    $("cfSave").disabled = true;
    try { await saveCats(lista); closeLayer(); toast("Metas salvas"); }
    catch { $("cfErr").textContent = "Não salvou. Tente de novo."; $("cfSave").disabled = false; }
  };
}

/* ---------- dados ---------- */
async function saveEntry(id, doc) {
  if (db) { if (id) await db.collection("lancamentos").doc(id).set(doc); else await db.collection("lancamentos").add(doc); }
  else { if (id) entries = entries.map(e => e.id === id ? { id, ...doc } : e); else entries.push({ id: "l" + Date.now(), ...doc }); render(); }
}
async function removeEntry(id) {
  if (db) await db.collection("lancamentos").doc(id).delete();
  else { entries = entries.filter(e => e.id !== id); render(); }
}
async function saveCats(lista) {
  if (db) await db.doc("config/categorias").set({ lista });
  else { cats = lista; render(); }
}
async function clearExamples() {
  const ex = entries.filter(e => e.exemplo);
  try { for (const e of ex) await removeEntry(e.id); toast("Exemplos apagados"); } catch { toast("Não consegui apagar tudo. Tente de novo."); }
}

/* ---------- eventos ---------- */
$("prev").onclick = () => { const [y,m] = ym.split("-").map(Number); const d = new Date(y, m-2, 1); ym = d.getFullYear() + "-" + pad(d.getMonth()+1); render(); };
$("next").onclick = () => { const [y,m] = ym.split("-").map(Number); const d = new Date(y, m, 1); ym = d.getFullYear() + "-" + pad(d.getMonth()+1); render(); };
$("fab").onclick = () => openEntry(null);
$("openCfg").onclick = openCfg;
document.querySelector(".filters").onclick = e => { const b = e.target.closest(".chip"); if (!b) return; filter = b.dataset.f; document.querySelectorAll(".filters .chip").forEach(c => c.setAttribute("aria-pressed", c === b)); render(); };
$("list").onclick = e => { const b = e.target.closest(".tx"); if (!b) return; const en = entries.find(x => x.id === b.dataset.id); if (en) openEntry(en); };
document.addEventListener("keydown", e => { if (e.key === "Escape") closeLayer(); });

render();

(async () => {
  try { db = await window.claude?.use?.("db"); } catch { db = null; }
  if (!db) { render(); return; }
  online = true;
  db.doc("config/categorias").onSnapshot(s => {
    const l = s.exists ? s.data().lista : null;
    if (Array.isArray(l) && l.length) cats = l.map(c => ({ ...c }));
    render();
  }, () => {});
  db.collection("lancamentos").limit(1000).onSnapshot(s => {
    entries = s.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, () => { online = false; render(); });
})();
})();
</script>
