<title>Trocado</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: celular = abas embaixo com botão central de lançar; desktop = barra lateral + painel em duas colunas. Premium = muito respiro, superfícies em camadas, números animados. */
:root {
  --mata: #17332A;
  --mata-2: #1F4537;
  --moeda: #F2B33D;
  --moeda-ink: #2A1E00;
  --bg: #EDF0EB;
  --surface: #FFFFFF;
  --surface-2: #F4F6F2;
  --surface-3: #E7ECE5;
  --ink: #12201A;
  --muted: #66746B;
  --faint: #98A49C;
  --line: rgba(18, 32, 26, .09);
  --in: #0F8A5F;
  --out: #C8473D;
  --warn: #B7791F;
  --hero-ink: #F3F7F2;
  --hero-muted: rgba(243, 247, 242, .62);
  --shadow-1: 0 1px 2px rgba(18,32,26,.05), 0 4px 16px rgba(18,32,26,.05);
  --shadow-2: 0 2px 4px rgba(18,32,26,.06), 0 18px 40px rgba(18,32,26,.12);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r-l: 26px; --r-m: 18px; --r-s: 12px;
  --ease: cubic-bezier(.2, .8, .2, 1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0A100D; --surface: #121A16; --surface-2: #18221D; --surface-3: #202C26; --ink: #ECF2ED; --muted: #93A398; --faint: #66766C;
  --line: rgba(236,242,237,.08); --in: #3CC48F; --out: #F07065; --warn: #E3A548; --mata: #173A2E; --mata-2: #22513F;
  --shadow-1: 0 1px 2px rgba(0,0,0,.4); --shadow-2: 0 20px 50px rgba(0,0,0,.5); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0A100D; --surface: #121A16; --surface-2: #18221D; --surface-3: #202C26; --ink: #ECF2ED; --muted: #93A398; --faint: #66766C;
  --line: rgba(236,242,237,.08); --in: #3CC48F; --out: #F07065; --warn: #E3A548; --mata: #173A2E; --mata-2: #22513F;
  --shadow-1: 0 1px 2px rgba(0,0,0,.4); --shadow-2: 0 20px 50px rgba(0,0,0,.5); color-scheme: dark; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--moeda); outline-offset: 2px; border-radius: 8px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.muted { color: var(--muted); }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- casca ---------- */
.shell { display: grid; grid-template-columns: 1fr; min-height: 100%; }
.side { display: none; }
main { min-width: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px 130px; max-width: 1180px; width: 100%; margin: 0 auto; }
@media (min-width: 980px) {
  .shell { grid-template-columns: 248px minmax(0, 1fr); }
  .side { display: flex; flex-direction: column; gap: 6px; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; padding: 26px 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); border-right: 1px solid var(--line); }
  main { padding-block: 18px 60px; padding-left: 36px; padding-right: max(36px, env(safe-area-inset-right, 0px)); }
  .tabbar { display: none !important; }
}
.logo { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 800; font-size: 24px; letter-spacing: -.045em; padding: 0 10px 22px; }
.logo svg { width: 30px; height: 30px; }
.nav { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 14px; color: var(--muted); font-weight: 600; width: 100%; text-align: left; transition: background .2s, color .2s; }
.nav:hover { background: var(--surface-2); color: var(--ink); }
.nav[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }
.side .cta { margin-top: 14px; }
.side-foot { margin-top: auto; font-size: 12px; color: var(--faint); padding: 0 12px; display: flex; align-items: center; gap: 6px; }

/* ---------- topo ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px 18px; flex-wrap: wrap; }
.hello small { display: block; color: var(--muted); font-size: 13px; font-weight: 500; }
.hello b { font-family: var(--f-display); font-size: 24px; font-weight: 800; letter-spacing: -.03em; }
.mpill { display: flex; align-items: center; gap: 2px; background: var(--surface); border-radius: 999px; padding: 4px; box-shadow: var(--shadow-1); }
.mpill button { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); transition: background .2s; }
.mpill button:hover { background: var(--surface-2); color: var(--ink); }
.mpill span { font-weight: 700; min-width: 118px; text-align: center; text-transform: capitalize; font-size: 14px; }

/* ---------- blocos ---------- */
.view { display: grid; gap: 18px; animation: rise .45s var(--ease); }
@keyframes rise { from { opacity: .3; transform: translateY(8px); } }
.cols { display: grid; gap: 18px; grid-template-columns: 1fr; }
@media (min-width: 980px) { .cols { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; } }
.stack { display: grid; gap: 18px; min-width: 0; }
.panel { background: var(--surface); border-radius: var(--r-l); padding: 22px; box-shadow: var(--shadow-1); min-width: 0; }
.ph { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 18px; }
.ph h2 { margin: 0; font-family: var(--f-display); font-size: 18px; font-weight: 700; letter-spacing: -.02em; }
.ph small, .ph .link { font-size: 13px; color: var(--muted); }
.ph .link { font-weight: 600; color: var(--ink); display: inline-flex; align-items: center; gap: 4px; }
.ph .link:hover { color: var(--in); }

/* hero */
.hero { position: relative; overflow: hidden; border-radius: 30px; padding: 26px 24px 22px; color: var(--hero-ink);
  background: radial-gradient(120% 140% at 100% 0%, var(--mata-2) 0%, var(--mata) 55%, #10261E 100%); box-shadow: var(--shadow-2); }
.hero::before { content: ""; position: absolute; inset: 0; background: radial-gradient(60% 50% at 0% 100%, rgba(242,179,61,.12), transparent 70%); pointer-events: none; }
.hero .coin { position: absolute; right: -46px; top: -40px; width: 210px; height: 210px; opacity: .14; pointer-events: none; }
.hero-l { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: var(--hero-muted); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.delta { letter-spacing: 0; text-transform: none; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: rgba(255,255,255,.1); color: var(--hero-ink); }
.delta.up { background: rgba(60,196,143,.2); color: #8EE6BF; }
.delta.down { background: rgba(240,112,101,.2); color: #FFB1A9; }
.big { font-family: var(--f-display); font-weight: 800; font-size: clamp(44px, 11vw, 64px); letter-spacing: -.045em; line-height: 1; margin: 10px 0 0; font-variant-numeric: tabular-nums; position: relative; }
.big .c { font-size: .45em; letter-spacing: -.02em; opacity: .7; margin-left: 2px; }
.big.neg { color: #FFB1A9; }
.flows { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 22px; position: relative; }
.flow { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.07); border-radius: 18px; padding: 12px 14px; backdrop-filter: blur(6px); }
.flow span { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--hero-muted); font-weight: 600; }
.flow span i { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; }
.flow span i svg { width: 12px; height: 12px; stroke-width: 2.4; }
.flow b { display: block; font-size: 18px; margin-top: 4px; font-weight: 600; }
.track { height: 6px; border-radius: 9px; background: rgba(255,255,255,.12); margin-top: 18px; overflow: hidden; position: relative; }
.track i { display: block; height: 100%; border-radius: 9px; background: var(--moeda); width: 0; transition: width .9s var(--ease); }
.track-l { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--hero-muted); margin-top: 8px; position: relative; }

/* insights */
.gm { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); margin-bottom: -8px; }
.gm span { color: var(--moeda); display: grid; } .gm svg { width: 16px; height: 16px; }
.insights { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(230px, 1fr); gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 4px; scrollbar-width: none; }
.insights::-webkit-scrollbar { display: none; }
.ins { scroll-snap-align: start; background: var(--surface); border-radius: var(--r-m); padding: 16px; box-shadow: var(--shadow-1); display: grid; gap: 8px; align-content: start; }
.ins .ic { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; }
.ins .ic svg { width: 18px; height: 18px; }
.ins p { margin: 0; font-size: 14px; color: var(--muted); }
.ins p b { color: var(--ink); font-weight: 700; }

/* donut */
.donut-wrap { display: grid; grid-template-columns: 168px minmax(0, 1fr); gap: 22px; align-items: center; }
@media (max-width: 460px) { .donut-wrap { grid-template-columns: 1fr; justify-items: center; } .legend { width: 100%; } }
.donut { position: relative; width: 168px; height: 168px; }
.donut svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.donut circle { transition: stroke-dasharray .8s var(--ease), stroke-dashoffset .8s var(--ease); }
.donut .mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.donut .mid small { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; font-weight: 700; }
.donut .mid b { font-size: 17px; }
.legend { display: grid; gap: 10px; min-width: 0; }
.lg { display: grid; grid-template-columns: 10px minmax(0,1fr) auto auto; gap: 10px; align-items: center; font-size: 14px; }
.lg i { width: 10px; height: 10px; border-radius: 4px; }
.lg span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lg em { font-style: normal; color: var(--faint); font-size: 12px; width: 36px; text-align: right; }

/* semanas */
.weeks { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0,1fr); gap: 10px; height: 150px; align-items: end; }
.wk { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 7px; height: 100%; min-width: 0; }
.wk .bh { width: 100%; max-width: 44px; border-radius: 12px 12px 6px 6px; background: var(--surface-3); min-height: 6px; transition: height .8s var(--ease); }
.wk.now .bh { background: linear-gradient(180deg, var(--moeda), #E39B1E); box-shadow: 0 6px 16px rgba(242,179,61,.35); }
.wk small { font-size: 11px; color: var(--faint); white-space: nowrap; }
.wk .v { font-size: 11px; color: var(--muted); white-space: nowrap; }
.wk.now small { color: var(--ink); font-weight: 700; }

/* lista de lançamentos */
.tx { display: grid; grid-template-columns: 42px minmax(0,1fr) auto; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 10px 8px; margin: 0 -8px; border-radius: 14px; transition: background .15s; width: calc(100% + 16px); }
.tx:hover { background: var(--surface-2); }
.tx .t b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx .t > span { display: block; font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx .amt { font-weight: 600; white-space: nowrap; font-size: 14.5px; }
.amt.in { color: var(--in); }
.cic { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; flex: none; }
.cic svg { width: 20px; height: 20px; }
.cic.sm { width: 34px; height: 34px; border-radius: 11px; } .cic.sm svg { width: 17px; height: 17px; }
.exb { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--warn); background: color-mix(in srgb, var(--moeda) 18%, transparent); padding: 1px 6px; border-radius: 6px; margin-left: 6px; vertical-align: 1px; }
.day { margin-top: 18px; }
.day:first-child { margin-top: 4px; }
.day-h { display: flex; justify-content: space-between; font-size: 12px; color: var(--faint); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; padding: 0 0 6px; }
.empty { text-align: center; padding: 34px 14px; color: var(--muted); display: grid; gap: 6px; justify-items: center; }
.empty svg { width: 54px; height: 54px; opacity: .9; }
.empty b { color: var(--ink); font-family: var(--f-display); font-size: 18px; }

/* extrato */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
.search { flex: 1 1 220px; display: flex; align-items: center; gap: 8px; background: var(--surface-2); border-radius: 14px; padding: 0 12px; color: var(--muted); }
.search input { border: 0; background: transparent; outline: none; padding: 11px 0; width: 100%; min-width: 0; color: var(--ink); }
.seg { display: inline-grid; grid-auto-flow: column; background: var(--surface-2); border-radius: 14px; padding: 4px; gap: 2px; }
.seg button { padding: 8px 14px; border-radius: 10px; font-weight: 600; font-size: 13.5px; color: var(--muted); transition: background .2s, color .2s; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }
.sumrow { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; margin-bottom: 6px; }
.sumrow div { background: var(--surface-2); border-radius: 14px; padding: 10px 12px; font-size: 12px; color: var(--muted); min-width: 0; }
.sumrow b { display: block; color: var(--ink); font-size: 15px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* metas */
.plan { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
.plan div { background: var(--surface-2); border-radius: 16px; padding: 14px; min-width: 0; }
.plan small { font-size: 12px; color: var(--muted); font-weight: 600; }
.plan b { display: block; font-size: 18px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 460px) { .plan b { font-size: 15px; } }
.goal { display: grid; grid-template-columns: 42px minmax(0,1fr); gap: 4px 14px; align-items: center; width: 100%; text-align: left; padding: 12px 8px; margin: 0 -8px; width: calc(100% + 16px); border-radius: 16px; transition: background .15s; }
.goal:hover { background: var(--surface-2); }
.goal .cic { grid-row: span 2; }
.g-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; min-width: 0; }
.g-top b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-top .num { font-size: 13px; white-space: nowrap; color: var(--muted); }
.g-top .num strong { color: var(--ink); font-weight: 600; }
.g-bar { height: 8px; border-radius: 9px; background: var(--surface-3); overflow: hidden; }
.g-bar i { display: block; height: 100%; border-radius: 9px; transition: width .8s var(--ease); }
.g-note { grid-column: 2; font-size: 12px; color: var(--muted); margin-top: 2px; }
.g-note.over { color: var(--out); font-weight: 600; }
.g-note.near { color: var(--warn); font-weight: 600; }
.group-t { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); margin: 18px 0 4px; }
.group-t:first-child { margin-top: 0; }

/* ajustes */
.setrow { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.setrow:last-child { border-bottom: 0; }
.setrow .grow { flex: 1; min-width: 0; }
.setrow small { display: block; color: var(--muted); font-size: 12.5px; }
.catrow { display: grid; grid-template-columns: 34px minmax(0,1fr) auto 32px; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.catrow input { border: 1px solid transparent; background: var(--surface-2); border-radius: 10px; padding: 9px 10px; width: 100%; min-width: 0; outline: none; }
.catrow input:focus { border-color: var(--moeda); }
.catrow .seg button { padding: 6px 10px; font-size: 12.5px; }
.catrow .rm { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; color: var(--faint); }
.catrow .rm:hover { background: var(--surface-2); color: var(--out); }
@media (max-width: 460px) { .catrow { grid-template-columns: 34px minmax(0,1fr) 32px; } .catrow .seg { grid-column: 2; grid-row: 2; justify-self: start; } .catrow .rm { grid-column: 3; grid-row: 1; } }

/* botões */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 16px; padding: 14px 18px; font-weight: 700; font-size: 15.5px; transition: transform .12s, filter .2s; }
.btn:active { transform: scale(.98); }
.btn.gold { background: linear-gradient(180deg, #F6C255, var(--moeda)); color: var(--moeda-ink); box-shadow: 0 8px 22px rgba(242,179,61,.35), inset 0 1px 0 rgba(255,255,255,.4); }
.btn.gold:hover { filter: brightness(1.04); }
.btn.soft { background: var(--surface-2); }
.btn.line { border: 1px dashed var(--faint); color: var(--muted); width: 100%; margin-top: 12px; }
.btn.danger { background: color-mix(in srgb, var(--out) 12%, transparent); color: var(--out); }
.btn.danger.armed { background: var(--out); color: #fff; }
.btn.sm { padding: 8px 14px; font-size: 13.5px; border-radius: 12px; }
.banner { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--surface); border-radius: var(--r-m); padding: 12px 14px 12px 16px; box-shadow: var(--shadow-1); font-size: 14px; }
.banner span { display: flex; gap: 10px; align-items: center; }
.banner span i { width: 8px; height: 8px; border-radius: 50%; background: var(--moeda); box-shadow: 0 0 0 4px color-mix(in srgb, var(--moeda) 25%, transparent); flex: none; }

/* barra de abas (celular) */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 8px max(14px, env(safe-area-inset-left, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-right, 0px)); background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4); border-top: 1px solid var(--line); }
.tabbar-in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); align-items: center; }
.tab { display: grid; justify-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--faint); padding: 6px 0; transition: color .2s; }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"] svg { stroke-width: 2.2; }
.plus { justify-self: center; width: 58px; height: 58px; border-radius: 20px; display: grid; place-items: center; margin-top: -26px; background: linear-gradient(180deg, #F6C255, var(--moeda)); color: var(--moeda-ink); box-shadow: 0 10px 26px rgba(242,179,61,.45), inset 0 1px 0 rgba(255,255,255,.45); transition: transform .15s; }
.plus:active { transform: scale(.94); }
.plus svg { width: 26px; height: 26px; stroke-width: 2.4; }

/* folha (lançar / editar) */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(5,10,8,.55); backdrop-filter: blur(4px); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s; }
.sheet { background: var(--surface); width: 100%; max-width: 540px; max-height: 94%; overflow: auto; border-radius: 30px 30px 0 0; padding: 10px 20px calc(22px + env(safe-area-inset-bottom, 0px)); padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); animation: up .35s var(--ease); box-shadow: var(--shadow-2); }
@media (min-width: 640px) { .scrim { align-items: center; } .sheet { border-radius: 30px; } }
.grab { width: 40px; height: 5px; border-radius: 9px; background: var(--surface-3); margin: 0 auto 12px; }
@keyframes up { from { transform: translateY(40px); opacity: .5; } }
@keyframes fade { from { opacity: 0; } }
.sh { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.sh h3 { margin: 0; font-family: var(--f-display); font-size: 20px; letter-spacing: -.02em; }
.x { width: 36px; height: 36px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; color: var(--muted); }
.kind { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 16px; padding: 4px; gap: 4px; }

        <div class="flows">
          <div class="flow"><span><i style="background:rgba(60,196,143,.22);color:#8EE6BF">${icon("up")}</i>Entrou</span><b class="num">${esc(money(S.ganho))}</b></div>
          <div class="flow"><span><i style="background:rgba(240,112,101,.22);color:#FFB1A9">${icon("down")}</i>Saiu</span><b class="num">${esc(money(S.gasto))}</b></div>
        </div>
        <div class="track"><i id="track" data-w="${Math.min(100, pct * 100)}" style="${pct > 1 ? "background:#F07065" : ""}"></i></div>
        <div class="track-l"><span>${S.ganho > 0 ? `Gastou ${Math.round(pct * 100)}% do que entrou` : S.gasto > 0 ? "Ainda não entrou nada este mês" : "Nenhum lançamento neste mês"}</span><span>${(planned("Ganho") || planned("Gasto")) ? "Previsto: " + esc(short(planned("Ganho") - planned("Gasto"))) : ""}</span></div>

      <section class="panel">
        <div class="ph"><h2>Pra onde foi</h2><small>gastos de ${MESES[m - 1]}</small></div>
        ${segs.length ? `<div class="donut-wrap"><div class="donut"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="42" fill="none" stroke="var(--surface-3)" stroke-width="11"/>${arcs}</svg><div class="mid"><small>Saiu</small><b class="num">${esc(short(S.gasto))}</b></div></div>
        <div class="legend">${segs.map(s => `<div class="lg"><i style="background:${s.c}"></i><span>${esc(s.nome)}</span><b class="num" style="font-weight:600;font-size:13.5px">${esc(short(s.v))}</b><em class="num">${Math.round(s.v / S.gasto * 100)}%</em></div>`).join("")}</div></div>`
        : emptyBox("Nenhum gasto ainda", "Quando você lançar, aparece aqui o que mais pesou no mês.")}
      </section>
    </div>

    <div class="stack">
      <section class="panel">
        <div class="ph"><h2>Semana a semana</h2><small>gastos, seg a dom</small></div>
        <div class="weeks">${ws.map((w, i) => { const now = iso(w.a) <= t && t <= iso(w.b); return `<div class="wk${now ? " now" : ""}" title="${esc(money(wv[i]))}"><span class="v num">${wv[i] ? esc(short(wv[i]).replace("R$ ", "")) : ""}</span><div class="bh" data-h="${Math.max(4, wv[i] / wmax * 100)}" style="height:4%"></div><small>${w.a.getDate()}–${w.b.getDate()}</small></div>`; }).join("")}</div>
      </section>
      <section class="panel">
        <div class="ph"><h2>Últimos lançamentos</h2>${S.list.length ? `<button class="link" data-go="extrato">Ver tudo ${icon("chev")}</button>` : ""}</div>
        ${recent.length ? recent.map(txRow).join("") : emptyBox("Nada lançado em " + MESES[m - 1], "Toque em Lançar, ou me conte no chat o que gastou que eu lanço pra você.")}
      </section>
    </div>
  </div>`;
}
function bigMoney(v) { const s = money(v); const i = s.lastIndexOf(","); return esc(s.slice(0, i)) + `<span class="c">${esc(s.slice(i))}</span>`; }
function emptyBox(t, s) { return `<div class="empty"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#mark"/></svg><b>${esc(t)}</b><span>${esc(s)}</span></div>`; }
const sortTx = (a, b) => b.data.localeCompare(a.data) || String(b.criadoEm || "").localeCompare(String(a.criadoEm || ""));
function txRow(e) {
  const c = catOf(e.categoria);
  return `<button class="tx" data-id="${esc(e.id)}">${cic(e.categoria)}<div class="t"><b>${esc(e.descricao || c.nome)}${e.exemplo ? '<span class="exb">exemplo</span>' : ""}</b><span>${esc(c.nome)}${e.pagamento ? " · " + esc(e.pagamento) : ""}</span></div><span class="amt num${e.tipo === "Ganho" ? " in" : ""}">${e.tipo === "Ganho" ? "+" : "−"}${esc(money(+e.valor || 0))}</span></button>`;
}

/* ---------- Extrato ---------- */
function viewExtrato() {
  const S = stats(ym);
  const qq = q.trim().toLowerCase();
  const list = S.list.filter(e => (filter === "all" || e.tipo === filter) && (!qq || (e.descricao || "").toLowerCase().includes(qq) || catOf(e.categoria).nome.toLowerCase().includes(qq))).sort(sortTx);
  const groups = {}; for (const e of list) (groups[e.data] ||= []).push(e);
  return `${exampleBanner()}<section class="panel">
    <div class="sumrow"><div>Entrou<b class="num" style="color:var(--in)">${esc(money(S.ganho))}</b></div><div>Saiu<b class="num">${esc(money(S.gasto))}</b></div><div>Sobrou<b class="num" style="${S.saldo < 0 ? "color:var(--out)" : ""}">${esc(money(S.saldo))}</b></div></div>
    <div class="toolbar" style="margin-top:14px">
      <label class="search">${icon("search")}<input id="q" type="search" placeholder="Buscar lançamento" value="${esc(q)}" aria-label="Buscar"></label>
      <div class="seg" role="group" aria-label="Filtro">${[["all", "Tudo"], ["Gasto", "Gastos"], ["Ganho", "Ganhos"]].map(([k, l]) => `<button data-f="${k}" aria-pressed="${filter === k}">${l}</button>`).join("")}</div>
    </div>
    ${list.length ? Object.keys(groups).map(d => {
      const it = groups[d], net = it.reduce((s, e) => s + (e.tipo === "Ganho" ? 1 : -1) * (+e.valor || 0), 0);
      const dl = parseISO(d).toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "short" });
      return `<div class="day"><div class="day-h"><span>${esc(dl)}</span><span class="num">${net >= 0 ? "+" : "−"}${esc(money(Math.abs(net)))}</span></div>${it.map(txRow).join("")}</div>`;
    }).join("") : emptyBox(qq ? "Nada encontrado" : "Nada lançado em " + mName(ym), qq ? "Tente outra palavra ou troque o filtro." : "Toque em Lançar pra começar.")}
  </section>`;
}

/* ---------- Metas ---------- */
function viewMetas() {
  const S = stats(ym);
  const pg = planned("Ganho"), ps = planned("Gasto");
  const goal = c => {
    const real = S.by[c.id] || 0, prev = +c.previsto || 0, col = colorOf(c.id), p = prev ? real / prev : 0;
    let note = "", cls = "", fill = col;
    if (!prev) note = real ? `${esc(money(real))} este mês · sem meta` : "Toque pra definir uma meta";
    else if (c.tipo === "Gasto") {
      if (p > 1) { note = `Passou ${esc(money(real - prev))} da meta`; cls = "over"; fill = "var(--out)"; }
      else { note = `Ainda pode gastar ${esc(money(prev - real))}`; if (p >= .85) cls = "near"; }
    } else note = p >= 1 ? "Meta batida" : `Faltam ${esc(money(prev - real))}`;
    return `<button class="goal" data-goal="${esc(c.id)}">${cic(c.id)}<div class="g-top"><b>${esc(c.nome)}</b><span class="num"><strong>${esc(short(real))}</strong>${prev ? " / " + esc(short(prev)) : ""}</span></div><div class="g-bar"><i data-w="${prev ? Math.min(100, p * 100) : 0}" style="width:0;background:${fill}"></i></div><div class="g-note ${cls}">${note}</div></button>`;
  };
  const gas = cats.filter(c => c.tipo === "Gasto").sort((a, b) => (S.by[b.id] || 0) / (+b.previsto || 1e9) - (S.by[a.id] || 0) / (+a.previsto || 1e9));
  return `<section class="panel">
    <div class="ph"><h2>Plano do mês</h2><small>vale pra todo mês</small></div>
    <div class="plan"><div><small>Vai entrar</small><b class="num" style="color:var(--in)">${esc(short(pg))}</b></div><div><small>Vai sair</small><b class="num">${esc(short(ps))}</b></div><div><small>Vai sobrar</small><b class="num" style="color:${pg - ps < 0 ? "var(--out)" : "var(--ink)"}">${esc(short(pg - ps))}</b></div></div>
    ${!pg && !ps ? `<p class="muted" style="margin:14px 0 0;font-size:14px">Toque em cada categoria pra dizer quanto espera ganhar ou quer gastar por mês.</p>` : ""}
  </section>
  <div class="cols">
    <section class="panel"><div class="ph"><h2>Gastos</h2><small>${mName(ym)}</small></div>${gas.map(goal).join("")}</section>
    <section class="panel"><div class="ph"><h2>Entradas</h2><small>${mName(ym)}</small></div>${cats.filter(c => c.tipo === "Ganho").map(goal).join("")}</section>
  </div>`;
}

/* ---------- Ajustes ---------- */
let draft = null;
function viewAjustes() {
  if (!draft) draft = cats.map(c => ({ ...c }));

      <button class="btn line" data-act="add-cat">+ Nova categoria</button>
      <div class="err" id="cErr"></div>
      <div class="actions"><button class="btn soft" data-act="reset-cat">Desfazer</button><button class="btn gold" data-act="save-cat">Salvar categorias</button></div>
    </section>

      <div class="ph"><h2>Preferências</h2></div>
      <div class="setrow"><div class="grow"><b>Aparência</b><small>Claro, escuro ou igual ao celular</small></div><div class="seg" role="group" aria-label="Aparência">${[["auto", "Auto"], ["light", "Claro"], ["dark", "Escuro"]].map(([k, l]) => `<button data-theme-set="${k}" aria-pressed="${theme === k}">${l}</button>`).join("")}</div></div>
      <div class="setrow"><div class="grow"><b>Seus dados</b><small>${online ? "Salvos na nuvem, só você vê." : "Abra pelo claude.ai logado pra salvar na nuvem."}</small></div></div>

/* ---------- animações pós-render ---------- */
function after() {
  requestAnimationFrame(() => {
    document.querySelectorAll("[data-w]").forEach(el => el.style.width = el.dataset.w + "%");
    document.querySelectorAll("[data-h]").forEach(el => el.style.height = el.dataset.h + "%");
  });
  const el = $("saldo");
  if (el) {
    const to = +el.dataset.v, from = shown.saldo;
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce || from === to) { el.innerHTML = bigMoney(to); shown.saldo = to; return; }
    const t0 = performance.now(), dur = 900;
    const step = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3); const v = from + (to - from) * e; if ($("saldo") === el) el.innerHTML = bigMoney(v); if (k < 1) requestAnimationFrame(step); else shown.saldo = to; };
    requestAnimationFrame(step);
  }
}

/* ---------- toast ---------- */
function toast(msg, undo) {
  $("toasts").innerHTML = "";
  const t = document.createElement("div"); t.className = "toast" + (undo ? "" : " solo"); t.setAttribute("role", "status");
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button>Desfazer</button>' : ""}`;
  if (undo) t.querySelector("button").onclick = () => { t.remove(); undo(); };
  $("toasts").appendChild(t); setTimeout(() => t.remove(), undo ? 5000 : 2400);
}

/* ---------- folha de lançamento ---------- */
function closeLayer() { $("layer").innerHTML = ""; }
function openEntry(entry, preset) {
  const editing = !!entry;
  const st = { tipo: entry?.tipo || preset?.tipo || "Gasto", categoria: entry?.categoria || preset?.categoria || "", pagamento: entry?.pagamento ?? "Pix", cents: entry ? Math.round(+entry.valor * 100) : 0,
    data: entry?.data || (ym === iso(today).slice(0, 7) ? iso(today) : ym + "-01") };
  const yest = new Date(today); yest.setDate(today.getDate() - 1);
  $("layer").innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shT">
    <div class="grab"></div>
    <div class="sh"><h3 id="shT">${editing ? "Editar lançamento" : "Novo lançamento"}</h3><button class="x" id="shX" aria-label="Fechar"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="kind" role="group" aria-label="Tipo">${["Gasto", "Ganho"].map(k => `<button data-k="${k}">${icon(k === "Gasto" ? "down" : "up")}${k}</button>`).join("")}</div>
    <label class="amount"><div class="disp" id="disp"></div><input id="amt" inputmode="numeric" autocomplete="off" aria-label="Valor em reais"><div class="hint">Digite só os números: 6290 vira R$ 62,90</div></label>
    <div class="lbl">Categoria</div><div class="cgrid" id="cgrid"></div>
    <div class="lbl">Quando</div>
    <div class="chips" id="when">
      <button class="chip" data-d="${iso(today)}">Hoje</button>
      <button class="chip" data-d="${iso(yest)}">Ontem</button>
      <label class="chip" id="dchip">${icon("cal")}<input type="date" id="dpick" value="${esc(st.data)}" aria-label="Escolher data"></label>
    </div>
    <div class="lbl">Descrição <span style="text-transform:none;letter-spacing:0;font-weight:500">(opcional)</span></div>
    <input class="text" id="desc" placeholder="Ex.: pizza com a galera" value="${esc(entry?.descricao || "")}">
    <div class="lbl">Pagamento</div><div class="chips" id="pag"></div>
    <div class="err" id="fErr"></div>
    <div class="actions">${editing ? `<button class="btn danger" id="del">${icon("trash")}</button>` : ""}<button class="btn gold" id="save">${editing ? "Salvar" : "Lançar"}</button></div>
  </div></div>`;
  const drawAmt = () => {
    const d = $("disp"); const v = st.cents / 100;
    const s = money(v).replace("R$", "").trim();
    d.innerHTML = `<small>R$</small>${esc(s)}`; d.classList.toggle("zero", !st.cents);
    d.style.color = st.cents ? (st.tipo === "Ganho" ? "var(--in)" : "") : "";
  };
  const drawKind = () => document.querySelectorAll(".kind button").forEach(b => b.setAttribute("aria-pressed", b.dataset.k === st.tipo));
  const drawCats = () => {
    const opts = cats.filter(c => c.tipo === st.tipo);
    if (!opts.some(c => c.id === st.categoria)) st.categoria = "";
    $("cgrid").innerHTML = opts.map(c => `<button class="cpick" data-c="${esc(c.id)}" aria-pressed="${c.id === st.categoria}">${cic(c.id, true)}<span>${esc(c.nome)}</span></button>`).join("");
  };
  const drawWhen = () => { let hit = false; document.querySelectorAll("#when [data-d]").forEach(b => { const on = b.dataset.d === st.data; hit ||= on; b.setAttribute("aria-pressed", on); }); $("dchip").setAttribute("aria-pressed", !hit); $("dpick").value = st.data; };
  const drawPag = () => { $("pag").innerHTML = PAGTOS.map(p => `<button class="chip" data-p="${p}" aria-pressed="${p === st.pagamento}">${p}</button>`).join(""); };
  drawKind(); drawAmt(); drawCats(); drawWhen(); drawPag();
  $("amt").value = st.cents ? String(st.cents) : "";
  $("amt").oninput = e => { const dg = e.target.value.replace(/\D/g, "").replace(/^0+/, "").slice(0, 9); e.target.value = dg; st.cents = +dg || 0; drawAmt(); };
  document.querySelector(".kind").onclick = e => { const b = e.target.closest("button"); if (!b) return; st.tipo = b.dataset.k; drawKind(); drawCats(); drawAmt(); };
  $("cgrid").onclick = e => { const b = e.target.closest("button"); if (!b) return; st.categoria = b.dataset.c; drawCats(); $("fErr").textContent = ""; };
  $("when").onclick = e => { const b = e.target.closest("[data-d]"); if (!b) return; st.data = b.dataset.d; drawWhen(); };
  $("dpick").onchange = e => { if (e.target.value) { st.data = e.target.value; drawWhen(); } };
  $("pag").onclick = e => { const b = e.target.closest("button"); if (!b) return; st.pagamento = st.pagamento === b.dataset.p ? "" : b.dataset.p; drawPag(); };
  $("shX").onclick = closeLayer;
  $("scrim").onclick = e => { if (e.target.id === "scrim") closeLayer(); };
  if (!editing) setTimeout(() => $("amt").focus(), 80);
  $("save").onclick = async () => {
    if (!st.cents) { $("fErr").textContent = "Digite o valor."; $("amt").focus(); return; }
    if (!st.categoria) { $("fErr").textContent = "Escolha uma categoria."; return; }
    const doc = { data: st.data, tipo: st.tipo, categoria: st.categoria, descricao: $("desc").value.trim(), valor: st.cents / 100, pagamento: st.pagamento, criadoEm: entry?.criadoEm || new Date().toISOString() };
    if (entry?.exemplo) doc.exemplo = true;
    $("save").disabled = true;
    try {
      await saveEntry(entry?.id, doc); closeLayer();
      toast(editing ? "Lançamento atualizado" : (doc.tipo === "Ganho" ? "Entrou " : "Saiu ") + money(doc.valor));
      if (doc.data.slice(0, 7) !== ym) { ym = doc.data.slice(0, 7); render(); }
    } catch { $("fErr").textContent = "Não salvou. Confira a internet e tente de novo."; $("save").disabled = false; }
  };
  if (editing) {
    let armed = false;
    $("del").onclick = async () => {
      if (!armed) { armed = true; $("del").classList.add("armed"); $("del").innerHTML = icon("trash") + "Apagar?"; return; }
      try { const { id, ...body } = entry; await removeEntry(id); closeLayer(); toast("Lançamento apagado", () => saveEntry(id, body).catch(() => toast("Não deu pra desfazer"))); }
      catch { $("fErr").textContent = "Não apagou. Tente de novo."; }
    };
  }
}

/* ---------- folha de meta ---------- */
function openGoal(id) {
  const c = catOf(id);
  let cents = Math.round((+c.previsto || 0) * 100);
  $("layer").innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="gT">
    <div class="grab"></div>
    <div class="sh"><h3 id="gT" style="display:flex;align-items:center;gap:10px">${cic(id, true)}${esc(c.nome)}</h3><button class="x" id="shX" aria-label="Fechar"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <p class="muted" style="margin:0">${c.tipo === "Ganho" ? "Quanto você espera receber por mês?" : "Quanto você quer gastar, no máximo, por mês?"}</p>
    <label class="amount"><div class="disp" id="disp"></div><input id="amt" inputmode="numeric" autocomplete="off" aria-label="Meta em reais"><div class="hint">Deixe zerado pra ficar sem meta</div></label>
    <div class="err" id="gErr"></div>
    <div class="actions"><button class="btn soft" id="gAdd">${icon(c.tipo === "Ganho" ? "up" : "down")}Lançar aqui</button><button class="btn gold" id="gSave">Salvar meta</button></div>
  </div></div>`;
  const draw = () => { const d = $("disp"); d.innerHTML = `<small>R$</small>${esc(money(cents / 100).replace("R$", "").trim())}`; d.classList.toggle("zero", !cents); };
  draw(); $("amt").value = cents ? String(cents) : "";
  $("amt").oninput = e => { const dg = e.target.value.replace(/\D/g, "").replace(/^0+/, "").slice(0, 9); e.target.value = dg; cents = +dg || 0; draw(); };
  setTimeout(() => $("amt").focus(), 80);
  $("shX").onclick = closeLayer; $("scrim").onclick = e => { if (e.target.id === "scrim") closeLayer(); };
  $("gAdd").onclick = () => openEntry(null, { tipo: c.tipo, categoria: id });
  $("gSave").onclick = async () => {
    $("gSave").disabled = true;
    try { await saveCats(cats.map(x => x.id === id ? { ...x, previsto: cents / 100 } : x)); closeLayer(); toast("Meta salva"); }
    catch { $("gErr").textContent = "Não salvou. Tente de novo."; $("gSave").disabled = false; }
  };
}

/* ---------- dados ---------- */
async function saveEntry(id, doc) {
  if (db) { if (id) await db.collection("lancamentos").doc(id).set(doc); else await db.collection("lancamentos").add(doc); }
  else { if (id) { const i = entries.findIndex(e => e.id === id); if (i >= 0) entries[i] = { id, ...doc }; else entries.push({ id, ...doc }); } else entries.push({ id: "l" + Date.now(), ...doc }); render(); }
}
async function removeEntry(id) { if (db) await db.collection("lancamentos").doc(id).delete(); else { entries = entries.filter(e => e.id !== id); render(); } }
async function saveCats(lista) { if (db) await db.doc("config/categorias").set({ lista }); else { cats = lista; render(); } }

/* ---------- eventos ---------- */
document.addEventListener("click", async e => {
  const t = e.target;
  const tb = t.closest("[data-tab]"); if (tb) { tab = tb.dataset.tab; draft = null; render(); scrollTo({ top: 0, behavior: "smooth" }); return; }
  const go = t.closest("[data-go]"); if (go) { tab = go.dataset.go; render(); scrollTo({ top: 0 }); return; }
  if (t.closest("[data-add]")) return openEntry(null);
  const tx = t.closest(".tx"); if (tx) { const en = entries.find(x => x.id === tx.dataset.id); if (en) openEntry(en); return; }
  const g = t.closest("[data-goal]"); if (g) return openGoal(g.dataset.goal);
  const f = t.closest("[data-f]"); if (f) { filter = f.dataset.f; render(); return; }
  const th = t.closest("[data-theme-set]"); if (th) { const v = th.dataset.themeSet; if (v === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", v); try { localStorage.setItem("sobrou-theme", v); } catch {} render(); return; }
  const ti = t.closest("[data-ti]"); if (ti) { draft[+ti.dataset.ti].tipo = ti.dataset.tv; render(); return; }
  const rm = t.closest("[data-rm]"); if (rm) { draft.splice(+rm.dataset.rm, 1); render(); return; }
  const act = t.closest("[data-act]")?.dataset.act;
  if (act === "add-cat") { draft.push({ id: "c" + Date.now().toString(36), nome: "", tipo: "Gasto", previsto: 0 }); render(); const ins = document.querySelectorAll("#catlist input"); ins[ins.length - 1]?.focus(); }
  if (act === "reset-cat") { draft = null; render(); }
  if (act === "save-cat") {
    const lista = draft.filter(c => String(c.nome).trim()).map(c => ({ ...c, nome: String(c.nome).trim() }));
    if (!lista.length) { $("cErr").textContent = "Deixe pelo menos uma categoria."; return; }
    try { await saveCats(lista); draft = null; toast("Categorias salvas"); render(); } catch { $("cErr").textContent = "Não salvou. Tente de novo."; }
  }
  if (act === "clear-ex") {
    const ex = entries.filter(x => x.exemplo);
    try { for (const x of ex) await removeEntry(x.id); toast("Exemplos apagados"); } catch { toast("Não consegui apagar tudo. Tente de novo."); }
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "q") { q = e.target.value; const pos = e.target.selectionStart; render(); const n = $("q"); n.focus(); n.setSelectionRange(pos, pos); }
  if (e.target.closest("#catlist") && e.target.dataset.i != null) draft[+e.target.dataset.i].nome = e.target.value;
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeLayer();
  if (e.key === "Enter" && $("save") && document.activeElement?.id !== "desc") { /* deixa Enter salvar no valor */ if (document.activeElement?.id === "amt") $("save").click(); }
});
$("prev").onclick = () => { ym = shiftYm(ym, -1); render(); };
$("next").onclick = () => { ym = shiftYm(ym, 1); render(); };

try { const th = localStorage.getItem("sobrou-theme"); if (th === "light" || th === "dark") document.documentElement.setAttribute("data-theme", th); } catch {}
render();

(async () => {
  try { db = await window.claude?.use?.("db"); } catch { db = null; }
  if (!db) return render();
  online = true;
  db.doc("config/categorias").onSnapshot(s => { const l = s.exists ? s.data().lista : null; if (Array.isArray(l) && l.length) cats = l.map(c => ({ ...c })); if (tab !== "ajustes") render(); else frame(); }, () => {});
  db.collection("lancamentos").limit(1000).onSnapshot(s => { entries = s.docs.map(d => ({ id: d.id, ...d.data() })); loaded = true; if (!(tab === "ajustes" && draft) && !document.querySelector("#q:focus")) render(); }, () => { online = false; render(); });
})();
})();
</script>
